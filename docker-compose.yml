# Local dev services. Not required if you use Neon + Upstash cloud free tiers.
# Usage: docker compose up -d
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: repocrawler-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: repocrawler
      POSTGRES_PASSWORD: repocrawler
      POSTGRES_DB: repocrawler
    ports:
      - "5432:5432"
    volumes:
      - repocrawler-pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: repocrawler-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - repocrawler-redis:/data

volumes:
  repocrawler-pg:
  repocrawler-redis:
