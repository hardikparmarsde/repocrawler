name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      # `next build` runs type checking internally and generates .next/types/
      # (LayoutProps etc.) that standalone `tsc --noEmit` relies on.
      # Running tsc before build fails because those types don't exist yet.
      - run: npm run build
        env:
          DATABASE_URL: postgres://stub:stub@localhost:5432/stub
          AUTH_SECRET: 00000000000000000000000000000000
          AUTH_GITHUB_ID: stub
          AUTH_GITHUB_SECRET: stub
